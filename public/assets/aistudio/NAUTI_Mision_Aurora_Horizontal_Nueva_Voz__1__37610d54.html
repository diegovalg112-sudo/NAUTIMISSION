<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAUTI — Misión Aurora</title><style>
:root{--navy:#08265b;--blue:#0a4593;--aqua:#00c7d4;--paper:#f4fcff;--ink:#15385e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 8%,#d6faff,#edf8ff 45%,#e6f0ff);font:16px/1.48 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}.shell{max-width:1050px;margin:auto;padding:20px}.head{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:72px;height:72px;object-fit:contain;border-radius:20px;background:white}.head small{display:block;color:#52708b}.creator{width:160px;max-width:33%;mix-blend-mode:multiply}.panel{background:#fff;border:1px solid #d5ecf5;border-radius:28px;padding:clamp(20px,4vw,42px);box-shadow:0 15px 45px #0c47721c;margin-top:18px}.tag{color:#007e99;text-transform:uppercase;font-size:12px;font-weight:800;letter-spacing:.13em}h1{font-size:clamp(27px,4vw,43px);color:var(--navy);line-height:1.12;margin:8px 0 14px}h2{color:var(--navy)}p{max-width:780px}.mascot{display:flex;align-items:center;gap:14px;background:#e9fbfe;border-radius:20px;padding:12px 18px;margin:18px 0}.face{width:84px;height:68px;border:5px solid #07509a;border-radius:48%;background:white;display:flex;align-items:center;justify-content:center;gap:11px;flex-shrink:0;box-shadow:0 0 0 6px #9ff1f2}.eye{width:15px;height:23px;background:#092c68;border-radius:50%;animation:blink 6s infinite}.mouth{position:absolute;margin-top:34px;width:15px;height:8px;border-radius:0 0 18px 18px;background:#0a3671}@keyframes blink{0%,96%,100%{transform:scaleY(1)}98%{transform:scaleY(.12)}}.danger .mascot{background:#ffe5e3}.danger .face{box-shadow:0 0 0 6px #ffb2a9}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.stat{background:#f0faff;border:1px solid #d8eff7;border-radius:17px;padding:13px}.stat strong{display:flex;justify-content:space-between;gap:4px}.meter{height:10px;background:#d9e8ef;border-radius:20px;overflow:hidden;margin-top:8px}.fill{height:100%;background:linear-gradient(90deg,#0a88bd,#00c7d4);transition:width .4s}.critical .fill{background:#e34f55}.critical{background:#fff1f0;border-color:#f6b2ae}.resources{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.pill{border-radius:40px;background:#e8f7fb;padding:8px 14px;font-weight:700}.options{display:grid;gap:10px;margin:20px 0}.choice{display:flex;text-align:left;align-items:center;gap:13px;background:white;color:var(--navy);border:2px solid #d5e8f2;border-radius:15px;padding:15px;font:inherit;cursor:pointer}.choice:hover,.choice.selected{border-color:var(--aqua);background:#e8fbff}.choice .letter{background:#e1f5f9;color:#007e9a;padding:5px 11px;border-radius:9px;font-weight:800}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}button{cursor:pointer;font:inherit}button.primary,button.secondary,button.soft{border:0;border-radius:14px;padding:12px 19px;font-weight:800}.primary{background:#063b83;color:white}.secondary{background:#03b9c8;color:#003459}.soft{background:#e7f3f8;color:#164d73}button:disabled{opacity:.45;cursor:not-allowed}.note{border-left:4px solid #00b6c5;background:#eefbfd;padding:15px;border-radius:0 14px 14px 0;margin:14px 0}.warning{border-left-color:#e67c45;background:#fff4eb}.small{font-size:13px;color:#58718b}.footer{font-size:13px;color:#58718b;text-align:center;padding:18px}.settings{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:12px 0}.settings label{font-size:13px}.settings input{vertical-align:middle}.step{font-size:14px;color:#5d7489}.hide{display:none!important}a{color:#0869a8}.big{font-size:22px;font-weight:800;color:#093b7b}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:650px){.stats{grid-template-columns:1fr}.head{align-items:flex-start}.brand img{width:52px;height:52px}.creator{width:110px}.summary{grid-template-columns:1fr}}

/* Paisaje de móvil horizontal: escenario 16:9, sin obligar al navegador a rotar el dispositivo */
html,body{min-height:100%;}body{overflow-x:hidden}.shell{width:min(100%,1120px);padding:clamp(8px,1.5vw,18px);margin:auto}.panel{padding:clamp(12px,2.1vw,26px);margin-top:10px}.head .brand img{width:clamp(45px,7vh,68px);height:clamp(45px,7vh,68px)}.creator{width:clamp(85px,18vw,145px)}.logo-face{width:clamp(130px,22vw,250px);flex-shrink:0;display:flex;align-items:center;justify-content:center;animation:nautiFloat 3.6s ease-in-out infinite;transform-origin:center 65%}.logo-face img{display:block;width:100%;height:auto;mix-blend-mode:multiply;filter:drop-shadow(0 5px 5px #0a459322)}.mascot{min-height:130px;gap:clamp(12px,3vw,28px)}.mascot>div:last-child{flex:1}.danger .logo-face{animation:nautiWorry .8s ease-in-out infinite alternate}@keyframes nautiFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}}@keyframes nautiWorry{from{transform:rotate(-2deg) translateY(0)}to{transform:rotate(2deg) translateY(-3px)}}@media (orientation:landscape) and (max-height:620px){.shell{max-width:1100px}.head{min-height:48px}.panel{margin-top:7px}.mascot{min-height:88px;padding:6px 14px;margin:8px 0}.logo-face{width:clamp(110px,20vh,165px)}h1{font-size:clamp(22px,4.8vh,32px);margin:4px 0 8px}.stats{grid-template-columns:repeat(3,1fr);margin:8px 0;gap:7px}.stat{padding:8px}.resources{margin:8px 0}.options{margin:10px 0;gap:7px}.choice{padding:9px 12px}.actions{margin:9px 0}.settings{margin:8px 0}.footer{padding:8px}}@media (orientation:portrait) and (max-width:650px){.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:7px}.stat strong{font-size:12px;flex-wrap:wrap}.mascot{gap:10px;padding:10px}.logo-face{width:110px}}@media(prefers-reduced-motion:reduce){.logo-face{animation:none!important}}
@media(orientation:landscape){.rotate-hint{display:none}}.rotate-hint{font-size:13px;text-align:center;color:#07509a;background:#ddf9fc;padding:8px;border-radius:12px;margin:8px 0}@media(min-width:800px){.rotate-hint{display:none}} 
/* Diseño optimizado específicamente para teléfono en horizontal */
@media (orientation:landscape) and (max-height:650px){
 html,body{width:100%;height:100%;overflow:hidden}
 .shell{height:100dvh;max-width:none;padding:6px 12px;display:flex;flex-direction:column}
 .head{flex:0 0 auto;min-height:38px;gap:8px}
 .head .brand img{width:35px;height:35px;border-radius:10px}
 .creator{max-height:32px;width:auto;max-width:125px;object-fit:contain}
 .panel{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin-top:5px;padding:10px 15px;border-radius:18px}
 .footer{flex:0 0 auto;padding:3px;font-size:10px}
 .mascot{min-height:65px;margin:5px 0;padding:5px 12px;gap:12px}
 .logo-face{width:clamp(72px,15vh,110px)}
 .stats{grid-template-columns:repeat(3,minmax(0,1fr));margin:5px 0;gap:6px}
 .stat{padding:5px 9px;border-radius:10px}.meter{height:6px;margin-top:3px}
 .resources{margin:5px 0}.pill{padding:4px 10px;font-size:12px}
 h1{font-size:clamp(20px,4.8vh,27px);margin:3px 0 6px}h2{margin:5px 0}
 p{margin:5px 0}.options{margin:7px 0;gap:5px}.choice{padding:7px 10px;border-radius:11px}
 .actions{margin:7px 0;gap:6px}.settings{margin:5px 0;gap:7px}
 button.primary,button.secondary,button.soft{padding:8px 12px;border-radius:10px}
 .note{padding:9px;margin:7px 0}
}

}

const SCENES=[{"title": "El primer amanecer", "story": "La base Aurora despierta bajo el horizonte lunar. Los paneles solares reciben poca luz y el laboratorio necesita energía para iniciar su primera investigación.", "question": "¿Cómo distribuimos la energía disponible?", "help": "Los sistemas de energía son esenciales para mantener operaciones y experimentos. En la Luna, la disponibilidad de luz solar depende del lugar y del ciclo de iluminación.", "source": "NASA — Moon to Mars: Lunar Surface Power", "url": "https://www.nasa.gov/moontomars/", "options": [["Priorizar soporte vital", "Protege a la tripulación, pero retrasa el trabajo científico.", [-7, 8, 0, 0], "La investigación arranca tarde y el equipo conserva un margen de seguridad.", null], ["Activar el laboratorio", "Acelera los experimentos a costa de reservas eléctricas.", [-17, -4, 0, 3], "El laboratorio avanza, pero la reserva de energía cae.", "battery"], ["Operación equilibrada", "Reparte energía entre soporte vital y laboratorio.", [-10, 0, 0, 1], "La base mantiene un equilibrio inicial.", null]]}, {"title": "Agua en circulación", "story": "El sistema de reciclaje detecta un filtro saturado. El agua recuperada todavía puede utilizarse, pero el mantenimiento consumirá energía.", "question": "¿Qué hacemos con el filtro?", "help": "En la Estación Espacial Internacional, la NASA ha demostrado una recuperación de agua cercana al 98 % con sistemas de procesamiento y recuperación; no significa que cualquier filtro lunar alcance ese rendimiento.", "source": "NASA — 98% Water Recovery on ISS (2023)", "url": "https://www.nasa.gov/missions/station/iss-research/space-station-water-recycling-system-achieves-98-water-recovery/", "options": [["Reparar ahora", "Consume energía, pero protege el suministro.", [-9, 2, 9, 1], "El filtro vuelve a operar con seguridad.", null], ["Posponer mantenimiento", "Ahorra energía ahora, con riesgo acumulado.", [3, 0, -6, 1], "El sistema sigue funcionando, aunque la avería no desaparece.", "filter"], ["Reducir el consumo", "Preserva reservas, pero limita actividades.", [1, -5, 6, 0], "La base restringe el uso de agua y ralentiza tareas.", null]]}, {"title": "Una señal inesperada", "story": "Un sensor exterior marca una anomalía. Podría ser polvo lunar adherido a una antena o un fallo del instrumento. El equipo tiene una ventana corta para investigar.", "question": "¿Cómo respondemos?", "help": "El regolito lunar es abrasivo y electrostáticamente problemático; la NASA investiga técnicas para limitar su impacto sobre equipos y operaciones.", "source": "NASA — Lunar Dust", "url": "https://www.nasa.gov/mission_pages/apollo/40th/apollo12_lunar_dust.html", "options": [["Inspección exterior", "Permite verificar el problema, con exposición y gasto.", [-9, -9, -3, 3], "Se detecta polvo acumulado y se recuperan datos.", null], ["Diagnóstico remoto", "Reduce exposición, aunque consume energía.", [-11, 1, 0, 2], "El diagnóstico encuentra señales útiles sin salir.", null], ["Ignorar la alarma", "Conserva recursos a corto plazo.", [3, 0, 0, 0], "La alerta queda pendiente de verificación.", "antenna"]]}, {"title": "La noche se acerca", "story": "La iluminación comienza a disminuir. Las reservas de energía deben alcanzar para mantener la temperatura y los equipos críticos.", "question": "¿Qué priorizamos durante la noche?", "help": "Las noches lunares pueden durar aproximadamente dos semanas terrestres en muchas regiones; sobrevivirlas exige planificación térmica y energética. La duración varía según la ubicación.", "source": "NASA — Moon Facts", "url": "https://science.nasa.gov/moon/facts/", "options": [["Reducir actividad científica", "Disminuye consumo y conserva margen de seguridad.", [8, 3, 0, -1], "El equipo entra en modo de bajo consumo.", null], ["Mantener experimentos", "Avanza investigación, pero aumenta el consumo.", [-16, -5, 0, 4], "Los experimentos continúan bajo presión energética.", null], ["Usar energía de reserva", "Protege operaciones actuales y reduce flexibilidad futura.", [4, 0, 0, 2], "La reserva estabiliza la base temporalmente.", "reserve"]]}, {"title": "La tripulación se fatiga", "story": "Tras varias jornadas, la tripulación muestra señales de cansancio. Hay tareas pendientes y los indicadores de salud necesitan atención.", "question": "¿Cómo reorganizamos la jornada?", "help": "NASA estudia los efectos del aislamiento, la carga de trabajo y el sueño en la salud y el rendimiento de las tripulaciones espaciales.", "source": "NASA — Human Research Program", "url": "https://www.nasa.gov/hrp/", "options": [["Descanso y chequeo", "Mejora la salud, a costa de progreso inmediato.", [-3, 13, -2, 0], "La tripulación recupera capacidad de respuesta.", null], ["Continuar trabajando", "Avanza la misión con riesgo para la salud.", [-6, -15, -5, 4], "La fatiga aumenta durante la jornada.", null], ["Turnos reducidos", "Equilibra recuperación y trabajo.", [-5, 5, -3, 2], "La actividad se reorganiza con menor presión.", null]]}, {"title": "El informe final", "story": "La Tierra solicita los resultados. Antes de transmitirlos, la base debe decidir cuánto recurso dedicar al envío de datos y cuánto conservar para la siguiente jornada.", "question": "¿Cómo cerramos la misión?", "help": "Las comunicaciones de misiones espaciales requieren planificación de enlaces, potencia y ventanas de transmisión. La NASA utiliza redes especializadas para enviar datos científicos.", "source": "NASA — Space Communications and Navigation", "url": "https://www.nasa.gov/space-communications-and-navigation-scan-program/", "options": [["Transmitir todo ahora", "Maximiza investigación, con alto consumo.", [-14, -4, -2, 4], "El informe completo llega a la Tierra.", null], ["Transmitir lo esencial", "Equilibra el envío y la seguridad.", [-7, 0, 0, 2], "La Tierra recibe los hallazgos prioritarios.", null], ["Esperar mejores condiciones", "Preserva recursos, pero reduce el progreso.", [3, 0, 0, 0], "El informe queda pendiente.", null]]}],TRIVIA=[["¿Qué porcentaje de recuperación de agua ha demostrado la NASA en la EEI con su sistema avanzado?", ["98 %", "45 %", "10 %"], 0, "La NASA informó de una demostración de recuperación de agua del 98 % en la EEI."], ["¿Por qué el polvo lunar puede ser un problema?", ["Porque es abrasivo y se adhiere a superficies", "Porque es líquido", "Porque produce oxígeno"], 0, "El regolito lunar puede afectar instrumentos, sellos y superficies."], ["¿Cuánto puede durar la noche lunar en muchas zonas de la Luna?", ["Unas 12 horas", "Aproximadamente dos semanas terrestres", "Unos 30 minutos"], 1, "La duración depende del lugar; en muchas regiones se aproxima a 14 días terrestres."]];

function spanishVoices(){return ('speechSynthesis' in window)?speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('es')):[]}
function updateVoiceOptions(){const select=document.getElementById('voiceChoice');if(!select)return;const voices=spanishVoices();select.replaceChildren();if(!voices.length){const o=document.createElement('option');o.textContent='Voz española del dispositivo';o.value='';select.append(o);return}voices.forEach(v=>{const o=document.createElement('option');o.value=v.voiceURI;o.textContent=v.name+' ('+v.lang+')';select.append(o)});if(!selectedVoice||!voices.some(v=>v.voiceURI===selectedVoice)){selectedVoice=(voices.find(v=>/google español|google spanish|pablo|jorge|diego|alvaro/i.test(v.name))||voices[voices.length-1]).voiceURI}select.value=selectedVoice}
if('speechSynthesis' in window)speechSynthesis.addEventListener('voiceschanged',updateVoiceOptions);
function say(t){if(!voiceOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=rate;u.pitch=pitch;u.volume=volume;const vs=spanishVoices();const v=vs.find(x=>x.voiceURI===selectedVoice)||vs.find(x=>/google español|google spanish|pablo|jorge|diego|alvaro/i.test(x.name))||vs[vs.length-1];if(v)u.voice=v;speechSynthesis.speak(u)}

function statUI(){return `<div class="stats">${[['energia','⚡','Energía'],['salud','♥','Salud'],['agua','💧','Agua']].map(([k,i,t])=>`<div class="stat ${stats[k]<=25?'critical':''}"><strong><span>${i} ${t}</span><span>${stats[k]}/100</span></strong><div class="meter"><div class="fill" style="width:${stats[k]}%"></div></div></div>`).join('')}</div><div class="resources"><span class="pill">🔬 Ciencia: ${science}</span><span class="pill">📡 Investigación: ${research}</span><span class="pill">🗓️ Jornada ${Math.min(step+1,6)} / 6</span></div>`}
function controls(t){return `<div class="settings"><button class="soft" onclick="readCurrent()">▶ Escuchar</button><button class="soft" onclick="speechSynthesis.cancel()">■ Detener</button><label>Voz de NAUTI <select id="voiceChoice" aria-label="Elegir voz" onchange="selectedVoice=this.value;readCurrent()"><option>Voces disponibles</option></select></label><button class="soft" onclick="readCurrent()">♫ Probar voz</button><label>Velocidad <input aria-label="Velocidad de voz" type="range" min=".7" max="1.25" step=".05" value="${rate}" oninput="rate=+this.value"></label><label>Tono <input aria-label="Tono de voz" type="range" min=".8" max="1.45" step=".05" value="${pitch}" oninput="pitch=+this.value"></label><label>Volumen <input aria-label="Volumen" type="range" min="0" max="1" step=".1" value="${volume}" oninput="volume=+this.value"></label></div>`}
function readCurrent(){voiceOn=true;let text=el.querySelector('[data-narration]');say(text?text.textContent:'Bienvenidos a NAUTI')}
function render(){speechSynthesis.cancel();queueMicrotask(updateVoiceOptions);document.body.classList.toggle('danger',phase==='scene'&&Object.values(stats).some(x=>x<=25));if(phase==='intro')return intro();if(phase==='tutorial')return tutorial();if(phase==='trivia')return quiz();if(phase==='result')return result();if(phase==='end')return end();return scene()}
function intro(){el.innerHTML=`<div class="tag">Bienvenidos, tripulación</div><h1>Una base lunar. Seis jornadas. Sus decisiones.</h1><div data-narration><p>¡Hola! Soy NAUTI. Acabamos de llegar a la base Aurora. Aquí no existe una respuesta perfecta para cada problema: debemos escuchar al equipo, usar la ciencia y cuidar nuestros recursos.</p><p>Ganan la misión completa si al terminar las seis jornadas conservan Energía, Salud y Agua <b>por encima de 25</b>, y alcanzan al menos <b>8 puntos de Investigación</b>. Si algún indicador llega a cero, la misión termina. También pueden completar la historia con un resultado parcial.</p></div>${mascot('¡No se preocupen! Primero practicaremos juntos cómo tomar decisiones.')}<div class="note"><b>Cómo jugar:</b> conversen en grupo, elijan una alternativa y confirmen. AYUDA revela datos científicos útiles; MODELAR cuesta 1 punto de Ciencia y muestra efectos estimados, incluso riesgos futuros. Las trivias correctas suman 1 punto de Ciencia.</div>${controls()}<div class="actions"><button class="primary" onclick="phase='tutorial';step=0;render()">Comenzar tutorial →</button></div>`}
function tutorial(){let screens=[['Conozcamos los indicadores','Energía mantiene equipos y temperatura. Salud reúne bienestar, alimentación, oxígeno y exposición a riesgos. Agua representa nuestras reservas utilizables.'],['AYUDA: investigar antes de decidir','AYUDA muestra un dato científico verificable que sirve para evaluar las alternativas. No revela cuál opción es perfecta.'],['MODELAR: anticipar consecuencias','MODELAR cuesta 1 punto de Ciencia y muestra cambios estimados de los indicadores y posibles riesgos futuros. Solo se puede usar una vez por jornada.'],['Decidir en equipo','Cada persona puede proponer una opción. Después, el grupo selecciona una alternativa y confirma. Solo entonces se aplican las consecuencias.']];let [title,desc]=screens[step];el.innerHTML=`<div class="tag">Tutorial interactivo · ${step+1} / 4</div><h1>${title}</h1><div data-narration><p>${desc}</p></div>${mascot(step===0?'¡Los tres indicadores comienzan en 50!':step===1?'La evidencia es una herramienta, no una respuesta automática.':step===2?'Modelar permite reducir incertidumbre, no eliminarla.':'¡Escuchen las ideas de todo el equipo!')}${step===0?statUI():step===1?`<div class="actions"><button class="secondary" onclick="document.getElementById('practice').classList.toggle('hide')">🔎 Probar AYUDA</button></div><div id="practice" class="note hide">NASA informa que en la EEI se ha demostrado una recuperación de agua de hasta el 98 % con sistemas avanzados. Esto puede orientar decisiones sobre reciclaje y mantenimiento.</div>`:step===2?`<div class="actions"><button class="secondary" onclick="document.getElementById('practice').classList.toggle('hide')">🔬 Probar MODELAR (sin costo)</button></div><div id="practice" class="note hide">Ejemplo de simulación: reparar un filtro puede consumir Energía, pero recuperar Agua y evitar una avería posterior.</div>`:`<div class="options"><button class="choice" onclick="this.classList.toggle('selected')"><span class="letter">A</span>Proteger recursos</button><button class="choice" onclick="this.classList.toggle('selected')"><span class="letter">B</span>Avanzar investigación</button></div><div class="small">Prueba seleccionando una alternativa; esta práctica no modifica tus indicadores.</div>`}${controls()}<div class="actions">${step?`<button class="soft" onclick="step--;render()">← Anterior</button>`:''}<button class="primary" onclick="if(step<3){step++;render()}else{step=0;phase='scene';render()}">${step===3?'Iniciar misión →':'Continuar →'}</button></div>`}
function scene(){let s=SCENES[step],crit=Object.entries(stats).filter(([k,v])=>v<=25).map(([k])=>k);el.innerHTML=`<div class="tag">Capítulo 1 · Jornada ${step+1}</div><h1>${esc(s.title)}</h1>${statUI()}${crit.length?`<div class="note warning"><b>⚠ Emergencia:</b> ${crit.join(', ')} en nivel crítico. Necesitamos actuar pronto.</div>`:''}<div data-narration><p>${esc(s.story)}</p><h2>${esc(s.question)}</h2></div>${mascot('¿Qué alternativa elegirían? Podemos consultar AYUDA o usar Ciencia para MODELAR antes de confirmar.')}<div class="options">${s.options.map((o,i)=>`<button class="choice ${chosen===i?'selected':''}" onclick="chosen=${i};render()"><span class="letter">${'ABC'[i]}</span><span>${esc(o[0])}</span></button>`).join('')}</div><div class="actions"><button class="secondary" onclick="showHelp=!showHelp;helpUsed=true;render()">💡 AYUDA</button><button class="secondary" ${science<1||modelUsed?'disabled':''} onclick="model()">🔬 MODELAR · 1 Ciencia</button></div>${showHelp?`<div class="note"><b>Consejo científico:</b> ${esc(s.help)}<div class="small">Fuente: <a target="_blank" rel="noopener" href="${s.url}">${esc(s.source)}</a> · La fuente puede requerir conexión para abrirse.</div></div>`:''}${showModel?`<div class="note"><b>Simulación:</b> ${chosen<0?'Selecciona una alternativa para ver su predicción.':modelText(s.options[chosen])}</div>`:''}${controls()}<div class="actions"><button class="primary" ${chosen<0?'disabled':''} onclick="confirmChoice()">Confirmar decisión →</button></div><div class="step">La consecuencia se mostrará después de confirmar.</div>`}
function modelText(o){return `${o[1]} Cambios previstos: Energía ${signed(o[2][0])}, Salud ${signed(o[2][1])}, Agua ${signed(o[2][2])}, Investigación ${signed(o[2][3])}. ${o[4]?'Posible efecto futuro: '+({'battery':'reservas eléctricas insuficientes','filter':'filtro degradado','antenna':'comunicaciones inestables','reserve':'menor flexibilidad energética'}[o[4]]||'riesgo diferido')+'.':''}`}
function signed(n){return (n>0?'+':'')+n}
function model(){if(science<1||modelUsed)return;science--;modelUsed=true;showModel=true;render()}
function confirmChoice(){if(chosen<0)return;let s=SCENES[step],o=s.options[chosen];['energia','salud','agua'].forEach((k,i)=>stats[k]=clamp(stats[k]+o[2][i]));research=Math.max(0,research+o[2][3]);if(o[4])flags.push(o[4]);log.push({jornada:step+1,decision:o[0],efectos:o[2],riesgo:o[4]||'ninguno'});feedback=o[3];phase='result';render()}
function result(){let events=[];if(step===3&&flags.includes('battery')){stats.energia=clamp(stats.energia-8);events.push('La activación temprana del laboratorio dejó menos energía disponible: −8 Energía.');flags=flags.filter(x=>x!=='battery')}if(step===3&&flags.includes('filter')){stats.agua=clamp(stats.agua-12);events.push('El filtro sin mantenimiento perdió rendimiento: −12 Agua.');flags=flags.filter(x=>x!=='filter')}if(step===4&&flags.includes('antenna')){research=Math.max(0,research-2);events.push('La alarma ignorada afectó la transmisión: −2 Investigación.');flags=flags.filter(x=>x!=='antenna')}if(step===5&&flags.includes('reserve')){stats.energia=clamp(stats.energia-8);events.push('El uso anterior de la reserva redujo la energía final: −8 Energía.');flags=flags.filter(x=>x!=='reserve')}if(events.length)log.push({jornada:step+1,efectoDiferido:events.join(' ')});let failed=Object.values(stats).some(v=>v===0);el.innerHTML=`<div class="tag">Consecuencias de la jornada ${step+1}</div><h1>${failed?'⚠ La base necesita evacuación':'Así cambió la misión'}</h1><div data-narration><p>${esc(feedback)}</p>${events.map(x=>`<p><b>Consecuencia acumulada:</b> ${esc(x)}</p>`).join('')}</div>${statUI()}${mascot(failed?'Nuestros recursos críticos se agotaron. Analicemos cómo llegamos aquí.':'¡Las decisiones tienen efectos inmediatos y también pueden dejar huellas para después!')}${controls()}<div class="actions"><button class="primary" onclick="${failed?"phase='end';render()":step===5?"phase='end';render()": [0,2,4].includes(step)?"phase='trivia';render()":"advance()"}">${failed?'Ver resultado':step===5?'Ver desenlace':[0,2,4].includes(step)?'Trivia científica →':'Siguiente jornada →'}</button></div>`}
function quiz(){let ix=[0,2,4].indexOf(step),q=TRIVIA[ix];el.innerHTML=`<div class="tag">Trivia científica · +1 Ciencia</div><h1>${esc(q[0])}</h1>${mascot('Una respuesta correcta nos dará un punto para usar MODELAR en otra decisión.')}<div class="options">${q[1].map((a,i)=>`<button class="choice ${triviaDone[step]!==undefined&&triviaDone[step]===i?'selected':''}" ${triviaDone[step]!==undefined?'disabled':''} onclick="answerQuiz(${i})"><span class="letter">${'ABC'[i]}</span>${esc(a)}</button>`).join('')}</div>${triviaDone[step]!==undefined?`<div class="note"><b>${triviaDone[step]===q[2]?'¡Correcto! +1 Ciencia':'Buena oportunidad para aprender. Sin penalización.'}</b> ${esc(q[3])}</div><button class="primary" onclick="advance()">Continuar aventura →</button>`:''}${controls()}`}
function answerQuiz(i){if(triviaDone[step]!==undefined)return;triviaDone[step]=i;if(i===TRIVIA[[0,2,4].indexOf(step)][2])science++;render()}
function advance(){step++;chosen=-1;showHelp=false;showModel=false;helpUsed=false;modelUsed=false;phase='scene';render()}
function end(){let dead=Object.values(stats).some(v=>v===0),full=!dead&&Object.values(stats).every(v=>v>25)&&research>=8,partial=!dead&&!full;el.innerHTML=`<div class="tag">Fin de la misión</div><h1>${full?'🏆 ¡Misión Aurora completada!':dead?'🚨 La misión no pudo continuar':'🌙 Misión completada parcialmente'}</h1>${statUI()}${mascot(full?'¡Lo logramos! La base está segura y enviamos resultados científicos.':dead?'La base se quedó sin un recurso esencial. Lo importante es aprender de las decisiones.':'Llegamos al final, pero todavía podemos mejorar el equilibrio entre seguridad e investigación.')}<div data-narration><p>${full?'La tripulación mantuvo los tres recursos por encima de 25 y alcanzó al menos 8 puntos de Investigación.':dead?'Uno de los recursos llegó a cero y la operación no pudo continuar.':'Terminamos seis jornadas, pero no alcanzamos todos los criterios de victoria completa.'}</p><p><b>Pregunta para conversar:</b> ¿Qué decisión tuvo una consecuencia inesperada? ¿Qué evidencia científica habría cambiado nuestra elección?</p></div><div class="actions"><button class="primary" onclick="downloadLog()">↓ Descargar bitácora</button><button class="secondary" onclick="restart()">↻ Jugar de nuevo</button></div>${controls()}`}
function downloadLog(){let data={simulador:'NAUTI Misión Aurora',indicadoresFinales:stats,ciencia:science,investigacion:research,decisiones:log};let a=document.createElement('a'),b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});a.href=URL.createObjectURL(b);a.download='NAUTI_bitacora.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restart(){speechSynthesis.cancel();phase='intro';step=0;chosen=-1;stats={energia:50,salud:50,agua:50};science=1;research=0;flags=[];log=[];triviaDone={};helpUsed=false;modelUsed=false;showHelp=false;showModel=false;feedback=null;render()}
render();
</script></body></html>
